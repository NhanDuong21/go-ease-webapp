name: Công việc GoEase
description: Mô tả đầu ra nhỏ, có thể kiểm tra và review.
title: "[GE-…] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: Mục đích
      description: Người dùng hoặc nhóm nhận được gì?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Cần làm
      placeholder: "- [ ] Đầu ra cụ thể"
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Chưa làm trong việc này
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Xong khi
      placeholder: "- [ ] Kết quả có thể kiểm chứng"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Phụ thuộc
      description: Link issue thật và key/quyền cần có; không điền secret.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Cách kiểm tra
      description: Lệnh hoặc luồng browser; ghi rõ mock/sandbox/live.
    validations:
      required: true
